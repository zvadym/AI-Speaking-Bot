services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file:
      - .env.api
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  miniapp:
    build:
      context: ../apps/miniapp
      args:
        - VITE_API_BASE=${VITE_API_BASE}
    restart: unless-stopped
    env_file:
      - .env.miniapp
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - miniapp
      - n8n
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - ${N8N_ENV_FILE:-.env}
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro

  n8n-import:
    image: n8nio/n8n:latest
    restart: "no"
    env_file:
      - ${N8N_ENV_FILE:-.env}
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    entrypoint: ["n8n"]
    command: ["import:workflow", "--separate", "--input", "/workflows/.rendered", "--overwrite"]

volumes:
  caddy_data:
  caddy_config:
