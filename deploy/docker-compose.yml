name: languagebot

services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file:
      - .env.api
    environment:
      - NODE_ENV=production
    volumes:
      - ./bots:/deploy/bots:ro
      - ./prompts:/deploy/prompts:ro
      - ../shared/llm-prompts:/shared/llm-prompts:ro
      - ./phrases:/deploy/phrases:ro
    expose:
      - "3000"

  worker:
    build:
      context: ../apps/api
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - .env.api
    environment:
      - NODE_ENV=production
    volumes:
      - ./bots:/deploy/bots:ro
      - ./prompts:/deploy/prompts:ro
      - ../shared/llm-prompts:/shared/llm-prompts:ro

  miniapp:
    build:
      context: ../apps/miniapp
      args:
        - VITE_API_BASE=${VITE_API_BASE}
        - VITE_STRIPE_EMBEDDED_CHECKOUT=${VITE_STRIPE_EMBEDDED_CHECKOUT}
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
        - VITE_ADMIN_PATH=${VITE_ADMIN_PATH}
        - VITE_SCHOOL_URL=${VITE_SCHOOL_URL}
    restart: unless-stopped
    env_file:
      - .env.miniapp
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - miniapp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
