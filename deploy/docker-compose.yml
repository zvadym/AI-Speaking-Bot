name: languagebot

services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file:
      - .env.api
    environment:
      - NODE_ENV=production
    volumes:
      - ./bots:/deploy/bots:ro
    expose:
      - "3000"

  worker:
    build:
      context: ../apps/api
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file:
      - .env.api
    environment:
      - NODE_ENV=production
    volumes:
      - ./bots:/deploy/bots:ro

  miniapp:
    build:
      context: ../apps/miniapp
      args:
        - VITE_API_BASE=${VITE_API_BASE}
        - VITE_STRIPE_EMBEDDED_CHECKOUT=${VITE_STRIPE_EMBEDDED_CHECKOUT}
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
        - VITE_ADMIN_PATH=${VITE_ADMIN_PATH}
        - VITE_SCHOOL_URL=${VITE_SCHOOL_URL}
    restart: unless-stopped
    env_file:
      - .env.miniapp
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - miniapp
      - n8n
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    image: n8nio/n8n:2.7.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - ${N8N_ENV_FILE:-.env}
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro

  n8n-import:
    image: n8nio/n8n:2.7.3
    profiles: ["tools"]
    restart: "no"
    env_file:
      - ${N8N_ENV_FILE:-.env}
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    entrypoint: ["sh"]
    command:
      - -lc
      - |
        if [ ! -d /workflows/.rendered ]; then
          echo "Missing /workflows/.rendered. Render workflows first." >&2
          exit 1
        fi
        found="0"
        for f in /workflows/.rendered/*.json; do
          if [ ! -f "$$f" ]; then
            continue
          fi
          found="1"
          echo "Importing workflow: $$f"
          n8n import:workflow --input "$$f" --overwrite || exit 1
        done
        if [ "$$found" != "1" ]; then
          echo "No workflow JSON files found in /workflows/.rendered" >&2
          exit 1
        fi

volumes:
  caddy_data:
  caddy_config:
