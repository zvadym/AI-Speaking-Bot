services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - ${N8N_ENV_FILE:-.env}
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro

  n8n-import:
    image: n8nio/n8n:latest
    restart: "no"
    env_file:
      - ${N8N_ENV_FILE:-.env}
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    entrypoint: ["n8n"]
    command: ["import:workflow", "--separate", "--input", "/workflows", "--overwrite"]
