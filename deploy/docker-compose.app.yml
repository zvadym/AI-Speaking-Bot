version: "3.8"

services:
  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    env_file:
      - .env.api
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  miniapp:
    build:
      context: ../apps/miniapp
      args:
        - VITE_API_BASE=${VITE_API_BASE}
    restart: unless-stopped
    env_file:
      - .env.miniapp
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - miniapp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
