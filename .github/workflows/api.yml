name: API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/api.yml"
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Test private environment tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test
        working-directory: apps/api
        run: npm test

      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck

      - name: Build
        working-directory: apps/api
        run: npm run build
