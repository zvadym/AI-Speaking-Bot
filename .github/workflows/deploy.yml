name: CD Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_n8n:
        description: "Skip n8n workflow render/import/activation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_HOST}" ]] || { echo "Missing secret: DEPLOY_HOST"; exit 1; }
          [[ -n "${DEPLOY_USER}" ]] || { echo "Missing secret: DEPLOY_USER"; exit 1; }
          [[ -n "${DEPLOY_SSH_PRIVATE_KEY}" ]] || { echo "Missing secret: DEPLOY_SSH_PRIVATE_KEY"; exit 1; }

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust deploy host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          DEPLOY_HOST: ${{ format('{0}@{1}', secrets.DEPLOY_USER, secrets.DEPLOY_HOST) }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_BRANCH: main
          SSH_FORWARD_AGENT: "false"
          SKIP_N8N_INPUT: ${{ github.event.inputs.skip_n8n || 'false' }}
        run: |
          set -euo pipefail
          if [[ "${SKIP_N8N_INPUT}" == "true" ]]; then
            SKIP_N8N=true ./scripts/deploy-remote.sh
          else
            SKIP_N8N=false ./scripts/deploy-remote.sh
          fi
